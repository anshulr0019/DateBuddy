<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#121829" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>
    
    <!-- Neon Accent Gradients -->
    <linearGradient id="roseViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3366" />
      <stop offset="50%" stop-color="#FF6584" />
      <stop offset="100%" stop-color="#9B51E0" />
    </linearGradient>

    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F6D365" />
      <stop offset="100%" stop-color="#FDA085" />
    </linearGradient>

    <!-- Glass Card Gradient -->
    <linearGradient id="glassGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80" result="blur" />
    </filter>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="50" result="blur" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Outfit', 'Inter', sans-serif;
      font-weight: 900;
      font-size: 68px;
      letter-spacing: -1.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Inter', sans-serif;
      font-weight: 500;
      font-size: 20px;
      letter-spacing: 0.5px;
      fill: #A0AEC0;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.3px;
    }
    .grid-line {
      stroke: #ffffff;
      stroke-opacity: 0.03;
      stroke-width: 1;
    }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="360" rx="20" fill="url(#bgGradient)" />

  <!-- Subtle Matrix Grid -->
  <line x1="100" y1="0" x2="100" y2="360" class="grid-line" />
  <line x1="300" y1="0" x2="300" y2="360" class="grid-line" />
  <line x1="500" y1="0" x2="500" y2="360" class="grid-line" />
  <line x1="700" y1="0" x2="700" y2="360" class="grid-line" />
  <line x1="900" y1="0" x2="900" y2="360" class="grid-line" />
  <line x1="1100" y1="0" x2="1100" y2="360" class="grid-line" />
  <line x1="0" y1="90" x2="1200" y2="90" class="grid-line" />
  <line x1="0" y1="180" x2="1200" y2="180" class="grid-line" />
  <line x1="0" y1="270" x2="1200" y2="270" class="grid-line" />

  <!-- Glowing Aurora Orbs -->
  <circle cx="250" cy="140" r="140" fill="#FF2A7A" opacity="0.3" filter="url(#glowPink)" />
  <circle cx="950" cy="180" r="170" fill="#7928CA" opacity="0.35" filter="url(#glowPurple)" />
  <circle cx="600" cy="300" r="120" fill="#00DFD8" opacity="0.15" filter="url(#glowCyan)" />

  <!-- Decorative Animated Wave / Curve at bottom -->
  <path d="M 0 310 Q 300 280 600 315 T 1200 300 L 1200 360 L 0 360 Z" fill="#ffffff" fill-opacity="0.02" />
  <path d="M 0 325 Q 350 350 700 310 T 1200 330 L 1200 360 L 0 360 Z" fill="url(#roseViolet)" fill-opacity="0.1" />

  <!-- Center Floating Glass Panel -->
  <g filter="url(#cardShadow)">
    <rect x="180" y="35" width="840" height="280" rx="24" fill="url(#glassGradient)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.2" />
  </g>

  <!-- App Heart Logo & Title -->
  <g transform="translate(600, 125)">
    <!-- Heart Icon Badge -->
    <g transform="translate(-185, -46)">
      <rect width="60" height="60" rx="16" fill="url(#roseViolet)" />
      <!-- Heart SVG Path -->
      <path d="M 30 45 C 30 45 14 34 14 23 C 14 17.5 18 13.5 23.5 13.5 C 26.5 13.5 29 15 30 17 C 31 15 33.5 13.5 36.5 13.5 C 42 13.5 46 17.5 46 23 C 46 34 30 45 30 45 Z" fill="#ffffff" />
    </g>

    <!-- Main Title -->
    <text x="-105" y="0" class="title-text" fill="#FFFFFF" text-anchor="start">
      Date<tspan fill="url(#roseViolet)">Buddy</tspan>
    </text>
  </g>

  <!-- Subtitle -->
  <text x="600" y="180" class="subtitle-text" text-anchor="middle">
    Where Connections Become Real • Next-Gen Dating &amp; Social Platform
  </text>

  <!-- Feature Pills Row -->
  <g transform="translate(600, 240)">
    <!-- Pill 1: Real-Time Chat -->
    <g transform="translate(-360, 0)">
      <rect x="0" y="0" width="165" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#FF4D8D" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="18" cy="19" r="5" fill="#00FF88" />
      <text x="32" y="24" class="pill-text" fill="#FFFFFF">⚡ Sub-50ms Chat</text>
    </g>

    <!-- Pill 2: WebRTC Calling -->
    <g transform="translate(-175, 0)">
      <rect x="0" y="0" width="165" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#9B51E0" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="18" cy="19" r="5" fill="#9B51E0" />
      <text x="32" y="24" class="pill-text" fill="#FFFFFF">📹 HD Video Calls</text>
    </g>

    <!-- Pill 3: In-Chat Games -->
    <g transform="translate(10, 0)">
      <rect x="0" y="0" width="165" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#00DFD8" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="18" cy="19" r="5" fill="#00DFD8" />
      <text x="32" y="24" class="pill-text" fill="#FFFFFF">🎮 In-Chat Games</text>
    </g>

    <!-- Pill 4: Anonymous Radar -->
    <g transform="translate(195, 0)">
      <rect x="0" y="0" width="165" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#FDA085" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="18" cy="19" r="5" fill="#FDA085" />
      <text x="32" y="24" class="pill-text" fill="#FFFFFF">🎭 Radar Dating</text>
    </g>
  </g>

</svg>
